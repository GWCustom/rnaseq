services:
  redis:
    image: redis:7-alpine
    container_name: rnaseq_redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rnaseqnet]

  web:
    build: .
    container_name: rnaseq_web
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    command: ["python", "-u", "index.py"]
    environment:
      HOST: "0.0.0.0"
      PORT: "${WEB_PORT:-8051}"
      DEBUG: "${DEBUG:-0}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      # WICHTIG: gleiche Namen wie im funktionierenden Setup
      BASE_DIR: "/home/azureuser/APPLICATION/temp_rnaseq_run"
      OUTPUT_DIR: "/home/azureuser/STORAGE"
      NEXTFLOW_BIN: "/home/azureuser/.local/bin/nextflow"
      NXF_HOME: "/workspace/.nextflow"
    ports:
      - "${WEB_PORT:-8051}:${WEB_PORT:-8051}"
    volumes:
      - .:/workspace
      - /home/azureuser/APPLICATION:/home/azureuser/APPLICATION
      - /home/azureuser/STORAGE:/home/azureuser/STORAGE
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ssh:/home/azureuser/.ssh:ro
      - /home/azureuser/.bfabricpy.yml:/home/azureuser/.bfabricpy.yml:ro
      # (optional) du brauchst die zweite .ssh-Mount nicht doppelt
    working_dir: /workspace
    networks: [rnaseqnet]

  worker:
    build: .
    container_name: rnaseq_worker
    # Optional: erstmal wie bisher – später besser non-root (s.u.)
    user: "0"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    command: ["python", "-u", "scripts/worker.py", "--queues=light,heavy"]
    environment:
      # Zurück zum funktionierenden Stil
      NXF_DOCKER_OPTS: "--user 0:0"
      NEXTFLOW_BIN: "/home/azureuser/.local/bin/nextflow"
      NXF_HOME: "/workspace/.nextflow"
      UID: "0"
      GID: "0"

      HOST: "0.0.0.0"
      PORT: "${WEB_PORT:-8051}"
      DEBUG: "${DEBUG:-0}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      # WICHTIG: gleiche Namen wie im funktionierenden Setup
      BASE_DIR: "/home/azureuser/APPLICATION/temp_rnaseq_run"
      OUTPUT_DIR: "/home/azureuser/STORAGE"
    volumes:
      - .:/workspace
      - /home/azureuser/APPLICATION:/home/azureuser/APPLICATION
      - /home/azureuser/STORAGE:/home/azureuser/STORAGE
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/azureuser/.bfabricpy.yml:/home/azureuser/.bfabricpy.yml:ro
      - /home/azureuser/.bfabricpy.yml:/root/.bfabricpy.yml:ro
      - /home/azureuser/.ssh:/home/azureuser/.ssh:ro
      - /home/azureuser/.ssh:/root/.ssh:ro
    working_dir: /workspace
    networks: [rnaseqnet]

networks:
  rnaseqnet:
    driver: bridge
